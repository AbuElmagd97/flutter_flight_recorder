name: example
description: "Example app demonstrating flutter_flight_recorder, flutter_flight_recorder_dio and flutter_flight_recorder_reporter together."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  # Matches the reporter package's floor (forced up by share_plus).
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ">=5.11.0 <6.0.0"
  flutter_flight_recorder:
    path: ../packages/flutter_flight_recorder
  flutter_flight_recorder_dio:
    path: ../packages/flutter_flight_recorder_dio
  flutter_flight_recorder_reporter:
    path: ../packages/flutter_flight_recorder_reporter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
